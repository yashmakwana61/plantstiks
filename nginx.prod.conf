# Reverse proxy for VPS full-stack deploy: static CRA build + /api -> backend.
# Shared Hostinger (Apache) ignores this file; it uses frontend/public/.htaccess instead.
# Replace server_name with your domains. TLS: terminate at Hostinger/CDN or mount
# certbot certs and add a 443 server block (see DEPLOY_HOSTINGER.md).

upstream backend {
    server backend:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name www.plantstiksbottle.in plantstiksbottle.in api.plantstiksbottle.in;

    # Security headers (also set in FastAPI; duplicated here for static assets)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # Enable HSTS only AFTER https works end-to-end:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m; # matches backend 25MB media limit
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (no caching for auth/mutations)
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Long-cache hashed CRA assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /* -> index.html (React Router needs this)
    location / {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.html;
    }
}

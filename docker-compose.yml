services:
  mongo:
    image: mongo:6
    container_name: plantstiks-mongo
    ports:
      - "27017:27017"
    volumes:
      - plantstiks-mongo-data:/data/db
    restart: unless-stopped

  backend:
    image: python:3.11-slim
    container_name: plantstiks-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    command: >
      bash -c "pip install -r requirements.txt
      && uvicorn server:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

volumes:
  plantstiks-mongo-data:
